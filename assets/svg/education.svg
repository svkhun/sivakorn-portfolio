<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <filter id="shadowEdu" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Soft Circles -->
  <circle cx="260" cy="200" r="170" fill="#EBF3FC" opacity="0.6"/>
  <circle cx="120" cy="110" r="30" fill="#E0F2FE" opacity="0.7"/>

  <!-- University / Library Building Facade Base -->
  <g filter="url(#shadowEdu)">
    <rect x="90" y="270" width="340" height="15" rx="4" fill="#94A3B8"/>
    <rect x="70" y="285" width="380" height="20" rx="4" fill="#CBD5E1"/>

    <!-- Stack of Engineering & Math Books -->
    <!-- Book 1 (Blue) -->
    <rect x="120" y="235" width="120" height="35" rx="4" fill="#0056B3"/>
    <rect x="125" y="240" width="110" height="5" rx="2" fill="#3B82F6"/>
    <text x="140" y="258" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">ALGORITHMS</text>

    <!-- Book 2 (Green) -->
    <rect x="135" y="200" width="110" height="35" rx="4" fill="#00A950"/>
    <rect x="140" y="205" width="100" height="5" rx="2" fill="#34D399"/>
    <text x="155" y="223" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">PROBABILITY</text>

    <!-- Book 3 (Dark Slate) -->
    <rect x="150" y="165" width="105" height="35" rx="4" fill="#1E293B"/>
    <rect x="155" y="170" width="95" height="5" rx="2" fill="#64748B"/>
    <text x="175" y="188" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">GRAPH ML</text>
  </g>

  <!-- Laptop / Learning Station -->
  <g filter="url(#shadowEdu)">
    <rect x="275" y="180" width="150" height="95" rx="6" fill="#1E293B"/>
    <rect x="282" y="187" width="136" height="75" rx="3" fill="#0F172A"/>
    <!-- Terminal prompt on laptop -->
    <text x="290" y="205" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">&gt; swu.degree.verify()</text>
    <text x="290" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0070F3">B.Eng. CompEng 2026</text>
    <text x="290" y="238" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E2E8F0">Status: PASS (97/150)</text>
    <!-- Base of laptop -->
    <path d="M260,275 L440,275 L430,285 L270,285 Z" fill="#94A3B8"/>
  </g>

  <!-- Floating Graduation Cap (Master's / Bachelor Mortarboard) -->
  <g filter="url(#shadowEdu)">
    <!-- Cap Diamond Top -->
    <polygon points="260,75 350,110 260,145 170,110" fill="#1E293B"/>
    <polygon points="260,82 335,111 260,140 185,111" fill="#0056B3"/>
    <!-- Skull Cap Base -->
    <path d="M215,128 L215,150 C215,170 305,170 305,150 L305,128 Z" fill="#1E293B"/>
    <!-- Button & Tassel -->
    <circle cx="260" cy="111" r="5" fill="#FBBF24"/>
    <path d="M260,111 C280,125 310,135 325,160" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
    <rect x="320" y="160" width="8" height="15" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Diploma Scroll -->
  <g filter="url(#shadowEdu)">
    <rect x="80" y="125" width="80" height="26" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" transform="rotate(-15 80 125)"/>
    <rect x="110" y="125" width="12" height="26" fill="#DC2626" transform="rotate(-15 80 125)"/>
  </g>
</svg>
