<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <filter id="shadowProj" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <circle cx="260" cy="200" r="170" fill="#EBF3FC" opacity="0.6"/>

  <!-- Code Window 1 -->
  <g filter="url(#shadowProj)">
    <rect x="70" y="80" width="310" height="220" rx="10" fill="#1E293B"/>
    <!-- Window Bar -->
    <rect x="70" y="80" width="310" height="32" rx="10" fill="#0F172A"/>
    <circle cx="90" cy="96" r="4" fill="#EF4444"/>
    <circle cx="102" cy="96" r="4" fill="#F59E0B"/>
    <circle cx="114" cy="96" r="4" fill="#10B981"/>
    <text x="135" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">k_sentinel_inference.py</text>

    <!-- Code Lines -->
    <text x="90" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">import <tspan fill="#F1F5F9">torch_geometric as pyg</tspan></text>
    <text x="90" y="155" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">import <tspan fill="#F1F5F9">onnxruntime as ort</tspan></text>
    <text x="90" y="180" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">def <tspan fill="#FBBF24">evaluate_fraud_sla</tspan>(tx_graph):</text>
    <text x="110" y="200" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8"># P99 target &lt; 12ms</text>
    <text x="110" y="220" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">emb = rgcn_encoder(tx_graph)</text>
    <text x="110" y="240" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">risk = onnx_session.run(emb)</text>
    <text x="110" y="260" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">return risk, "APPROVED_SAFE"</text>
  </g>

  <!-- Front UI Card Overlay (Dashboard & Metrics) -->
  <g filter="url(#shadowProj)">
    <rect x="240" y="150" width="220" height="170" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="240" y="150" width="220" height="34" rx="10" fill="#F8FAFC"/>
    <text x="255" y="172" font-family="'Inter', sans-serif" font-size="11" fill="#0056B3" font-weight="700">K-Sentinel Live Dashboard</text>

    <!-- Stat 1 -->
    <rect x="255" y="195" width="90" height="42" rx="6" fill="#F1F5F9"/>
    <text x="263" y="210" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Inference P99</text>
    <text x="263" y="226" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00A950" font-weight="700">11.62 ms</text>

    <!-- Stat 2 -->
    <rect x="355" y="195" width="90" height="42" rx="6" fill="#F1F5F9"/>
    <text x="363" y="210" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">CASA Target</text>
    <text x="363" y="226" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0056B3" font-weight="700">2.0B THB</text>

    <!-- Progress / Bar -->
    <text x="255" y="262" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Model Stability: PSI &lt; 0.10</text>
    <rect x="255" y="270" width="190" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="255" y="270" width="165" height="8" rx="4" fill="#00A950"/>
  </g>

  <!-- Deployment Rocket / Arrow -->
  <g filter="url(#shadowProj)">
    <circle cx="430" cy="110" r="26" fill="#0056B3"/>
    <path d="M430,95 L438,110 L434,110 L434,122 L426,122 L426,110 L422,110 Z" fill="#FFFFFF"/>
  </g>
</svg>
