<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <desc>Illustrative architecture. LOD V13 out-of-fold ROC-AUC 0.65333 is attributed to the project README; it is not an inference probability or production benchmark.</desc>
  <defs>
    <linearGradient id="mlCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadowDS" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Soft Bubble -->
  <circle cx="250" cy="200" r="160" fill="#EBF3FC" opacity="0.6"/>

  <!-- Main Chart Canvas Board -->
  <g filter="url(#shadowDS)">
    <rect x="70" y="60" width="360" height="260" rx="14" fill="url(#mlCardGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Header -->
    <rect x="70" y="60" width="360" height="36" rx="14" fill="#F1F5F9"/>
    <circle cx="95" cy="78" r="4" fill="#EF4444"/>
    <circle cx="107" cy="78" r="4" fill="#F59E0B"/>
    <circle cx="119" cy="78" r="4" fill="#10B981"/>
    <text x="145" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B" font-weight="600">LOD V13 · OOF ROC-AUC: 0.65333</text>

    <!-- A process diagram, not an invented ROC trace. -->
    <rect x="110" y="120" width="280" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="250" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1E293B">Financial-ratio features</text>
    <path d="M250 166v22m-5-5 5 5 5-5" fill="none" stroke="#64748B" stroke-width="2"/>
    <rect x="110" y="192" width="280" height="42" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="250" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1E293B">CatBoost + LightGBM · V13</text>
    <text x="250" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">Out-of-fold experiment · README source</text>
  </g>

  <!-- Floating Metric Pill 1 -->
  <g filter="url(#shadowDS)">
    <rect x="40" y="270" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="65" cy="295" r="14" fill="#E8F5E9"/>
    <path d="M60,295 L64,299 L71,291" fill="none" stroke="#00A950" stroke-width="2.5" stroke-linecap="round"/>
    <text x="88" y="289" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" font-weight="600">Evidence</text>
    <text x="88" y="306" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1E293B" font-weight="700">README</text>
  </g>

  <!-- Floating Metric Pill 2 -->
  <g filter="url(#shadowDS)">
    <rect x="320" y="40" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="345" cy="65" r="14" fill="#EBF3FC"/>
    <text x="340" y="70" font-family="'JetBrains Mono', monospace" font-size="14" fill="#0056B3" font-weight="700">G</text>
    <text x="368" y="59" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" font-weight="600">Scope</text>
    <text x="368" y="76" font-family="'JetBrains Mono', monospace" font-size="13" fill="#0056B3" font-weight="700">Competition</text>
  </g>
</svg>
