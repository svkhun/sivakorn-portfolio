<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="shadowEng" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <circle cx="250" cy="200" r="160" fill="#EEF2F6" opacity="0.7"/>

  <!-- Server Stack 1: Fast Edge Streaming (WebSockets) -->
  <g filter="url(#shadowEng)">
    <rect x="70" y="90" width="110" height="200" rx="8" fill="#1E293B"/>
    <!-- Server Slots -->
    <rect x="80" y="105" width="90" height="30" rx="4" fill="#334155"/>
    <circle cx="92" cy="120" r="3" fill="#10B981"/>
    <circle cx="102" cy="120" r="3" fill="#0070F3"/>

    <rect x="80" y="145" width="90" height="30" rx="4" fill="#334155"/>
    <circle cx="92" cy="160" r="3" fill="#10B981"/>
    <circle cx="102" cy="160" r="3" fill="#10B981"/>

    <rect x="80" y="185" width="90" height="30" rx="4" fill="#334155"/>
    <circle cx="92" cy="200" r="3" fill="#10B981"/>
    <circle cx="102" cy="200" r="3" fill="#0070F3"/>

    <rect x="80" y="225" width="90" height="30" rx="4" fill="#334155"/>
    <circle cx="92" cy="240" r="3" fill="#10B981"/>
    <circle cx="102" cy="240" r="3" fill="#10B981"/>

    <text x="82" y="275" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">EDGE STREAM</text>
  </g>

  <!-- Connectors / Pipeline Arrows -->
  <path d="M180,160 L230,160 L230,180 L280,180" fill="none" stroke="#0070F3" stroke-width="2.5" stroke-dasharray="5 5"/>
  <circle cx="230" cy="160" r="4" fill="#0070F3"/>

  <!-- Server Stack 2: PostgreSQL 15 & Data Mart -->
  <g filter="url(#shadowEng)">
    <!-- PostgreSQL Cylindrical Database -->
    <rect x="280" y="100" width="150" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="280" y="100" width="150" height="36" rx="10" fill="#EBF3FC"/>
    <text x="300" y="122" font-family="'Inter', sans-serif" font-size="12" fill="#0056B3" font-weight="700">PostgreSQL 15</text>

    <!-- Cylinder Disk 1 -->
    <ellipse cx="355" cy="160" rx="55" ry="12" fill="#336791"/>
    <path d="M300,160 L300,175 C300,182 355,182 355,182 C355,182 410,182 410,175 L410,160 Z" fill="#295274"/>
    <ellipse cx="355" cy="160" rx="55" ry="12" fill="#4285C4"/>

    <!-- Cylinder Disk 2 -->
    <ellipse cx="355" cy="205" rx="55" ry="12" fill="#336791"/>
    <path d="M300,205 L300,220 C300,227 355,227 355,227 C355,227 410,227 410,220 L410,205 Z" fill="#295274"/>
    <ellipse cx="355" cy="205" rx="55" ry="12" fill="#4285C4"/>

    <text x="300" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" font-weight="600">OEE Data Mart</text>
  </g>

  <!-- Floating Fast Microservice Pill -->
  <g filter="url(#shadowEng)">
    <rect x="180" y="295" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="208" cy="321" r="14" fill="#E0F2FE"/>
    <path d="M208,312 L215,321 L208,330 L201,321 Z" fill="#0070F3"/>
    <text x="232" y="315" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" font-weight="600">FastAPI Telemetry</text>
    <text x="232" y="332" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00A950" font-weight="700">&lt; 1.0s Edge Push</text>
  </g>
</svg>
