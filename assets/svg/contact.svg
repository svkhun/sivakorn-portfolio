<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <filter id="shadowContact" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <circle cx="260" cy="200" r="170" fill="#EBF3FC" opacity="0.6"/>

  <!-- Envelope Main Card -->
  <g filter="url(#shadowContact)">
    <rect x="110" y="120" width="300" height="190" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Envelope Flap -->
    <polygon points="110,120 260,225 410,120" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Letter Inside Rising Up -->
    <rect x="140" y="70" width="240" height="110" rx="8" fill="#0056B3" filter="url(#shadowContact)"/>
    <rect x="160" y="90" width="90" height="6" rx="3" fill="#93C5FD"/>
    <rect x="160" y="105" width="150" height="4" rx="2" fill="#DBEAFE"/>
    <rect x="160" y="117" width="130" height="4" rx="2" fill="#DBEAFE"/>
    <rect x="160" y="129" width="100" height="4" rx="2" fill="#DBEAFE"/>
    <circle cx="345" cy="120" r="15" fill="#10B981"/>
    <path d="M340,120 L344,124 L351,116" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Contact Details on Envelope Front -->
    <text x="140" y="270" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1E293B" font-weight="700">sivakorn.khun@gmail.com</text>
    <text x="140" y="290" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Bangkok, Thailand &#8226; Open to Work</text>
  </g>

  <!-- Communication / Chat Bubble 1 -->
  <g filter="url(#shadowContact)">
    <rect x="60" y="80" width="90" height="40" rx="8" fill="#1E293B"/>
    <text x="75" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">Say Hello 👋</text>
  </g>

  <!-- Communication / Chat Bubble 2 -->
  <g filter="url(#shadowContact)">
    <rect x="360" y="270" width="110" height="40" rx="8" fill="#00A950"/>
    <text x="375" y="295" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">Let's Connect!</text>
  </g>
</svg>
