<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Ambient Shapes -->
  <circle cx="300" cy="225" r="190" fill="#EBF3FC" opacity="0.6"/>
  <circle cx="480" cy="120" r="35" fill="#E0F2FE" opacity="0.8"/>
  <rect x="70" y="80" width="60" height="60" rx="16" fill="#F1F5F9" opacity="0.9"/>
  <path d="M460,340 L500,380 L440,390 Z" fill="#E2E8F0" opacity="0.5"/>

  <!-- Desk Surface -->
  <rect x="40" y="340" width="520" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="80" y="354" width="16" height="70" rx="4" fill="#94A3B8"/>
  <rect x="504" y="354" width="16" height="70" rx="4" fill="#94A3B8"/>

  <!-- Left Secondary Monitor (Data Science Charts) -->
  <g filter="url(#subtleShadow)">
    <rect x="80" y="160" width="150" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="90" y="170" width="130" height="150" rx="4" fill="url(#screenGrad)"/>
    <!-- Code / Charts on Screen -->
    <rect x="100" y="182" width="50" height="6" rx="3" fill="#0070F3"/>
    <rect x="100" y="196" width="80" height="4" rx="2" fill="#64748B"/>
    <rect x="100" y="206" width="65" height="4" rx="2" fill="#64748B"/>
    <rect x="100" y="216" width="90" height="4" rx="2" fill="#64748B"/>
    <!-- Line Chart -->
    <polyline points="100,285 125,270 145,278 170,245 195,255 210,230" fill="none" stroke="#00A950" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="170" cy="245" r="3.5" fill="#00A950"/>
    <circle cx="210" cy="230" r="3.5" fill="#38BDF8"/>
  </g>
  <!-- Stand for Left Monitor -->
  <rect x="145" y="330" width="20" height="12" fill="#94A3B8"/>
  <rect x="135" y="338" width="40" height="4" rx="2" fill="#64748B"/>

  <!-- Central Primary Monitor (ML / Neural Nodes) -->
  <g filter="url(#subtleShadow)">
    <rect x="220" y="110" width="220" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="230" y="120" width="200" height="160" rx="6" fill="url(#screenGrad)"/>
    <!-- Window Header -->
    <circle cx="245" cy="132" r="4" fill="#EF4444"/>
    <circle cx="257" cy="132" r="4" fill="#F59E0B"/>
    <circle cx="269" cy="132" r="4" fill="#10B981"/>
    <!-- Neural Network Visual on Screen -->
    <line x1="260" y1="165" x2="330" y2="155" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="195" x2="330" y2="155" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="225" x2="330" y2="155" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="165" x2="330" y2="200" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="195" x2="330" y2="200" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="225" x2="330" y2="200" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="165" x2="330" y2="245" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="195" x2="330" y2="245" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="260" y1="225" x2="330" y2="245" stroke="#0070F3" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="330" y1="155" x2="395" y2="200" stroke="#10B981" stroke-width="2"/>
    <line x1="330" y1="200" x2="395" y2="200" stroke="#10B981" stroke-width="2"/>
    <line x1="330" y1="245" x2="395" y2="200" stroke="#10B981" stroke-width="2"/>

    <!-- Nodes Layer 1 -->
    <circle cx="260" cy="165" r="7" fill="#1E293B" stroke="#0070F3" stroke-width="2"/>
    <circle cx="260" cy="195" r="7" fill="#1E293B" stroke="#0070F3" stroke-width="2"/>
    <circle cx="260" cy="225" r="7" fill="#1E293B" stroke="#0070F3" stroke-width="2"/>
    <!-- Hidden Layer -->
    <circle cx="330" cy="155" r="8" fill="#0056B3"/>
    <circle cx="330" cy="200" r="8" fill="#0056B3"/>
    <circle cx="330" cy="245" r="8" fill="#0056B3"/>
    <!-- Output Node -->
    <circle cx="395" cy="200" r="10" fill="#10B981"/>
  </g>
  <!-- Center Stand -->
  <rect x="320" y="290" width="20" height="50" fill="#94A3B8"/>
  <rect x="295" y="336" width="70" height="6" rx="3" fill="#64748B"/>

  <!-- Developer Figure Sitting (Master Developer Style) -->
  <g id="developer-figure">
    <!-- Chair Back -->
    <rect x="380" y="210" width="30" height="130" rx="10" fill="#334155"/>
    <!-- Head & Hair -->
    <circle cx="365" cy="180" r="28" fill="#FBBF24" opacity="0.3"/>
    <circle cx="365" cy="180" r="22" fill="#FDBA74"/>
    <path d="M346,176 Q360,154 384,168 Q388,180 380,186 Q372,174 352,176 Z" fill="#1E293B"/>
    <!-- Glasses -->
    <rect x="345" y="176" width="12" height="8" rx="2" fill="none" stroke="#0056B3" stroke-width="2"/>
    <rect x="360" y="176" width="12" height="8" rx="2" fill="none" stroke="#0056B3" stroke-width="2"/>
    <line x1="357" y1="180" x2="360" y2="180" stroke="#0056B3" stroke-width="2"/>
    <!-- Torso / Hoodie -->
    <path d="M335,215 Q365,200 395,215 L405,320 L325,320 Z" fill="#0056B3"/>
    <!-- Arm typing on keyboard -->
    <path d="M345,230 Q325,270 300,285 L320,305 Q350,285 365,250 Z" fill="#004494"/>
    <circle cx="295" cy="288" r="8" fill="#FDBA74"/>
    <!-- Keyboard on desk -->
    <rect x="260" y="332" width="90" height="6" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <!-- Mouse -->
    <rect x="375" y="333" width="14" height="6" rx="3" fill="#64748B"/>
  </g>

  <!-- Coffee Mug -->
  <rect x="470" y="318" width="18" height="22" rx="4" fill="#EF4444"/>
  <path d="M488,322 C494,322 494,332 488,332" fill="none" stroke="#EF4444" stroke-width="3"/>
  <path d="M474,310 Q476,302 480,312" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Plant on Desk -->
  <path d="M65,340 L85,340 L80,320 L70,320 Z" fill="#D97706"/>
  <ellipse cx="75" cy="308" rx="10" ry="16" fill="#10B981"/>
  <ellipse cx="68" cy="314" rx="8" ry="12" fill="#059669" transform="rotate(-20 68 314)"/>
  <ellipse cx="82" cy="314" rx="8" ry="12" fill="#34D399" transform="rotate(20 82 314)"/>
</svg>
