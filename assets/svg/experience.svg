<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <defs>
    <filter id="shadowExp" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <circle cx="260" cy="200" r="170" fill="#EEF2F6" opacity="0.6"/>

  <!-- Milestone Career Pathway / Board -->
  <g filter="url(#shadowExp)">
    <!-- Pathway Ribbon -->
    <path d="M90,300 C160,280 200,220 260,220 C320,220 360,140 430,120" fill="none" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <path d="M90,300 C160,280 200,220 260,220 C320,220 360,140 430,120" fill="none" stroke="#0056B3" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>

    <!-- Checkpoint 1 (LINE MAN Wongnai 2024) -->
    <circle cx="120" cy="292" r="14" fill="#FFFFFF" stroke="#00A950" stroke-width="3"/>
    <circle cx="120" cy="292" r="6" fill="#00A950"/>
    <rect x="65" y="325" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="75" y="340" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">LINE MAN</text>
    <text x="75" y="352" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1E293B" font-weight="700">8.87 THB CAC</text>

    <!-- Checkpoint 2 (Aihack Thailand Finalist 2025) -->
    <circle cx="240" cy="220" r="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="3.5"/>
    <circle cx="240" cy="220" r="7" fill="#DC2626"/>
    <rect x="180" y="160" width="125" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="190" y="176" font-family="'Inter', sans-serif" font-size="9" fill="#DC2626" font-weight="700">Aihack Thailand</text>
    <text x="190" y="192" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1E293B" font-weight="700">Finalist &#8226; 0.894</text>

    <!-- Checkpoint 3 (KBTG Kampus Hackathon 2026) -->
    <circle cx="410" cy="125" r="18" fill="#FFFFFF" stroke="#0056B3" stroke-width="4"/>
    <circle cx="410" cy="125" r="8" fill="#0056B3"/>
    <rect x="345" y="55" width="135" height="45" rx="6" fill="#1E293B"/>
    <text x="358" y="73" font-family="'Inter', sans-serif" font-size="9" fill="#0070F3" font-weight="700">KBTG Kampus 2026</text>
    <text x="358" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700">Track 2 Lead</text>
  </g>

  <!-- Trophy Graphic -->
  <g filter="url(#shadowExp)">
    <rect x="305" y="270" width="30" height="12" rx="2" fill="#F59E0B"/>
    <rect x="316" y="248" width="8" height="22" fill="#FBBF24"/>
    <path d="M300,210 L340,210 C340,235 328,248 320,248 C312,248 300,235 300,210 Z" fill="#FBBF24"/>
    <!-- Handles -->
    <path d="M300,215 C285,215 285,235 302,238" fill="none" stroke="#FBBF24" stroke-width="3"/>
    <path d="M340,215 C355,215 355,235 338,238" fill="none" stroke="#FBBF24" stroke-width="3"/>
  </g>
</svg>
