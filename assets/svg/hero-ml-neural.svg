<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Gradients -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lossGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <!-- Crisp Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Ambient Ambient Radial Glow -->
  <circle cx="300" cy="230" r="210" fill="url(#heroGlow)"/>

  <!-- Subtle Coordinate Matrix Background Grid -->
  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="90" x2="520" y2="90"/>
    <line x1="80" y1="170" x2="520" y2="170"/>
    <line x1="80" y1="250" x2="520" y2="250"/>
    <line x1="80" y1="330" x2="520" y2="330"/>
    <line x1="120" y1="60" x2="120" y2="380"/>
    <line x1="220" y1="60" x2="220" y2="380"/>
    <line x1="320" y1="60" x2="320" y2="380"/>
    <line x1="420" y1="60" x2="420" y2="380"/>
  </g>

  <!-- Central Technical Topology Card -->
  <g filter="url(#softShadow)">
    <rect x="70" y="55" width="460" height="320" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Terminal Control Bar -->
    <rect x="70" y="55" width="460" height="38" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="96" cy="74" r="4.5" fill="#EF4444"/>
    <circle cx="110" cy="74" r="4.5" fill="#F59E0B"/>
    <circle cx="124" cy="74" r="4.5" fill="#10B981"/>
    <text x="148" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569" font-weight="600">inference_engine :: relational_gcn_v2.onnx</text>
    <rect x="415" y="65" width="102" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="466" y="79" font-family="'JetBrains Mono', monospace" font-size="9" fill="#B45309" font-weight="700" text-anchor="middle">&lt; 12ms SLA</text>

    <!-- Graph Neural Network Topology & Latent Embeddings (Center Canvas) -->
    <!-- Synaptic Connection Edges -->
    <g stroke-linecap="round">
      <!-- Input to Hidden Layer 1 -->
      <line x1="150" y1="150" x2="250" y2="130" stroke="#2563EB" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="150" y1="150" x2="250" y2="190" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.4"/>
      <line x1="150" y1="150" x2="250" y2="250" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.3"/>

      <line x1="150" y1="210" x2="250" y2="130" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.3"/>
      <line x1="150" y1="210" x2="250" y2="190" stroke="#2563EB" stroke-width="2.5" stroke-opacity="0.7"/>
      <line x1="150" y1="210" x2="250" y2="250" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.3"/>

      <line x1="150" y1="270" x2="250" y2="130" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.3"/>
      <line x1="150" y1="270" x2="250" y2="190" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.4"/>
      <line x1="150" y1="270" x2="250" y2="250" stroke="#2563EB" stroke-width="2" stroke-opacity="0.6"/>

      <!-- Hidden Layer 1 to Latent Cluster -->
      <line x1="250" y1="130" x2="350" y2="160" stroke="#2563EB" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="250" y1="130" x2="350" y2="220" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.3"/>

      <line x1="250" y1="190" x2="350" y2="160" stroke="#2563EB" stroke-width="2.5" stroke-opacity="0.8"/>
      <line x1="250" y1="190" x2="350" y2="220" stroke="#2563EB" stroke-width="2" stroke-opacity="0.6"/>

      <line x1="250" y1="250" x2="350" y2="160" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.3"/>
      <line x1="250" y1="250" x2="350" y2="220" stroke="#2563EB" stroke-width="2" stroke-opacity="0.6"/>

      <!-- Latent to Output Recourse Node -->
      <line x1="350" y1="160" x2="450" y2="190" stroke="#059669" stroke-width="3" stroke-opacity="0.85"/>
      <line x1="350" y1="220" x2="450" y2="190" stroke="#059669" stroke-width="3" stroke-opacity="0.85"/>
    </g>

    <!-- Synaptic Nodes: Input Features (Layer 0) -->
    <g>
      <circle cx="150" cy="150" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="150" cy="150" r="4" fill="#2563EB"/>
      <text x="110" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="end">feat_01</text>

      <circle cx="150" cy="210" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="150" cy="210" r="4" fill="#2563EB"/>
      <text x="110" y="214" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="end">feat_02</text>

      <circle cx="150" cy="270" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="150" cy="270" r="4" fill="#2563EB"/>
      <text x="110" y="274" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="end">feat_03</text>
    </g>

    <!-- Synaptic Nodes: Relational Graph Layer (Layer 1 - 16D Mule Embeddings) -->
    <g>
      <circle cx="250" cy="130" r="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
      <circle cx="250" cy="130" r="5" fill="#3B82F6"/>

      <circle cx="250" cy="190" r="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
      <circle cx="250" cy="190" r="6" fill="#2563EB"/>

      <circle cx="250" cy="250" r="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
      <circle cx="250" cy="250" r="5" fill="#3B82F6"/>
      <text x="250" y="280" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" font-weight="600" text-anchor="middle">RGCN-16D</text>
    </g>

    <!-- Synaptic Nodes: Latent Aggregation (Layer 2) -->
    <g>
      <circle cx="350" cy="160" r="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="350" cy="160" r="5" fill="#2563EB"/>

      <circle cx="350" cy="220" r="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="350" cy="220" r="5" fill="#2563EB"/>
      <text x="350" y="250" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" font-weight="600" text-anchor="middle">Latent Space</text>
    </g>

    <!-- Output Decision Node (Layer 3 - FinTech Emerald Verified Decision) -->
    <g>
      <circle cx="450" cy="190" r="19" fill="#059669"/>
      <circle cx="450" cy="190" r="15" fill="#10B981"/>
      <polyline points="443,190 448,195 457,185" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="450" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#059669" font-weight="800" text-anchor="middle">P(y)=0.894</text>
    </g>

    <!-- Bottom Mathematical Loss Convergence Bar -->
    <g transform="translate(100, 310)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" font-weight="600">LOSS CONVERGENCE</text>
      <!-- Mini Loss Curve Line -->
      <path d="M120,20 Q160,2 220,1 Q260,1 320,0" fill="none" stroke="url(#lossGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <text x="335" y="6" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2563EB" font-weight="700">0.018</text>
    </g>
  </g>

  <!-- Floating Telemetry Badge 1: Top Right (ROC-AUC Proof Point - Royal Blue) -->
  <g filter="url(#softShadow)">
    <rect x="420" y="20" width="150" height="52" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="445" cy="46" r="13" fill="#EFF6FF"/>
    <path d="M439,49 L443,41 L448,46 L453,39" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="466" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" font-weight="600">Model ROC-AUC</text>
    <text x="466" y="56" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2563EB" font-weight="800">0.894</text>
  </g>

  <!-- Floating Telemetry Badge 2: Bottom Left (Low Latency P99 SLA - Amber Accent) -->
  <g filter="url(#softShadow)">
    <rect x="40" y="360" width="165" height="54" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="68" cy="387" r="14" fill="#FEF3C7"/>
    <!-- Bolt icon -->
    <path d="M69,378 L63,388 L68,388 L67,396 L74,386 L69,386 Z" fill="#D97706"/>
    <text x="90" y="381" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" font-weight="600">P99 Inference SLA</text>
    <text x="90" y="399" font-family="'JetBrains Mono', monospace" font-size="13" fill="#D97706" font-weight="800">11.62 ms</text>
  </g>

  <!-- Floating Telemetry Badge 3: Bottom Right (Real-time Stream Idempotent - Emerald Accent) -->
  <g filter="url(#softShadow)">
    <rect x="375" y="375" width="185" height="50" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <circle cx="402" cy="400" r="13" fill="#ECFDF5"/>
    <path d="M397,400 L401,404 L408,396" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="424" y="394" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" font-weight="600">ONNX Serving Engine</text>
    <text x="424" y="410" font-family="'JetBrains Mono', monospace" font-size="11" fill="#059669" font-weight="700">FastAPI &#8226; Redis Cache</text>
  </g>
</svg>
