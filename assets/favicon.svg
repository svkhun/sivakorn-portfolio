<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Royal Cobalt Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="60%" stop-color="#0047B3"/>
      <stop offset="100%" stop-color="#002E7A"/>
    </linearGradient>

    <!-- Top Gloss Sweep -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- White-to-Ice-Cyan Gradient for Monogram -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="ambientCore" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001433" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="14" y="14" width="484" height="484" rx="118" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="118" fill="url(#ambientCore)"/>
  <rect x="14" y="14" width="484" height="484" rx="118" fill="url(#topGloss)"/>
  <rect x="14" y="14" width="484" height="484" rx="118" fill="none" stroke="rgba(255, 255, 255, 0.42)" stroke-width="4"/>

  <!-- Centered Bold Modern 'S' Monogram -->
  <path fill="url(#monogramGrad)" filter="url(#softGlow)" d="
    M 364 162
    C 364 122, 326 88, 256 88
    C 186 88, 148 124, 148 164
    C 148 206, 184 228, 246 244
    C 308 260, 342 280, 342 318
    C 342 362, 300 392, 246 392
    C 174 392, 138 352, 136 300
    L 196 300
    C 198 326, 218 346, 248 346
    C 282 346, 296 330, 296 312
    C 296 286, 274 272, 212 256
    C 156 242, 102 220, 102 166
    C 102 116, 150 50, 256 50
    C 360 50, 410 112, 410 162
    Z" />

  <!-- Signature Flourish Underline with Glowing Pen Nib -->
  <path d="M 88 424 C 160 454, 280 454, 388 418" fill="none" stroke="#38BDF8" stroke-width="22" stroke-linecap="round"/>
  <circle cx="396" cy="415" r="15" fill="#FFFFFF"/>
</svg>