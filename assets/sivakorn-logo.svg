<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="sivakorn">
  <defs>
    <style>
      .logo-text {
        font-family: 'Geist Mono', 'SF Mono', Monaco, Menlo, Consolas, monospace;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
        fill: #0F172A;
      }
      .logo-cursor {
        fill: #0066FF;
        animation: blink 1.1s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @media (prefers-color-scheme: dark) {
        .logo-text { fill: #FAFAFA; }
        .logo-cursor { fill: #38BDF8; }
      }
    </style>
  </defs>
  <text x="8" y="38" class="logo-text">sivakorn</text>
  <rect x="168" y="16" width="3.5" height="26" rx="1.5" class="logo-cursor" />
</svg>
