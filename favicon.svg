<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Luxury Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Electric Cyan-Blue Tech Gradient -->
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080C16" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Drop Glow -->
    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with 1px Hairline Border -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#ambientGlow)"/>
  <rect x="14" y="14" width="484" height="484" rx="112" fill="none" stroke="#1E293B" stroke-width="4"/>
  <rect x="14" y="14" width="484" height="484" rx="112" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>

  <!-- Sivakorn Signature Initial 'S' Monogram -->
  <g transform="translate(256, 230) scale(2.65) translate(-108.5, -86.5)" filter="url(#sigGlow)">
    <path fill="url(#sigGrad)" d="M 85.9 145.6 Q 79.2 145.6 69.1 137.6 Q 62.1 136.4 57.0 134.5 Q 52.0 132.6 48.7 130.0 Q 44.1 126.0 40.7 119.5 Q 37.2 112.9 37.2 106.8 Q 37.2 102.2 39.3 98.6 Q 44.3 89.8 51.9 89.8 Q 57.6 89.8 58.6 99.5 Q 59.8 108.6 60.5 114.0 Q 61.2 119.3 61.7 120.9 Q 64.2 129.0 70.1 134.6 Q 77.0 136.1 85.1 136.1 Q 102.9 136.1 119.2 129.3 Q 126.1 126.4 132.7 121.6 Q 139.3 116.8 143.5 111.1 Q 147.8 105.3 147.8 99.9 Q 147.8 92.1 134.2 87.9 L 105.2 81.3 Q 96.3 79.3 90.9 74.3 Q 85.6 69.3 85.6 62.8 Q 85.6 53.0 97.9 43.1 Q 104.2 38.0 112.6 34.4 Q 121.0 30.9 130.3 29.0 Q 139.6 27.1 148.1 27.1 Q 160.3 27.1 169.0 30.9 Q 177.6 34.7 179.8 41.9 Q 180.2 43.6 180.2 45.6 Q 180.2 55.6 170.2 59.5 Q 164.1 62.0 159.8 62.0 Q 157.2 62.0 155.7 61.0 Q 155.4 60.7 155.4 60.2 Q 155.4 59.1 160.0 58.9 Q 162.8 58.7 164.6 58.4 Q 166.4 58.1 167.2 57.7 Q 173.5 54.4 173.5 48.0 Q 173.5 44.7 171.7 41.1 Q 166.6 31.7 146.2 31.7 Q 138.8 31.7 130.9 33.3 Q 123.0 34.9 115.9 37.9 Q 108.8 40.9 103.9 45.6 Q 95.3 53.5 95.3 59.7 Q 95.3 64.5 100.0 68.2 Q 104.7 71.9 114.2 73.7 L 133.7 77.3 Q 144.9 79.5 151.8 83.7 Q 158.7 87.9 158.7 96.4 Q 158.7 104.0 154.9 110.6 Q 151.1 117.2 144.8 122.3 Q 138.4 127.5 130.4 131.0 Q 112.1 139.1 87.2 139.1 Q 84.1 139.1 81.0 138.9 Q 77.9 138.7 74.9 138.4 Q 77.2 139.7 80.7 141.0 Q 84.3 142.3 88.9 143.5 Q 89.4 143.7 89.4 144.2 Q 89.4 145.6 85.9 145.6 Z M 64.2 133.0 Q 59.8 128.0 57.3 122.8 Q 53.7 114.5 51.9 102.5 Q 50.5 93.8 49.1 93.8 Q 47.7 93.8 45.5 95.8 Q 43.3 97.7 43.3 104.2 Q 43.3 116.7 52.2 125.9 Q 56.6 130.5 64.2 133.0 Z"/>
  </g>

  <!-- Signature Flourish Underline -->
  <path d="M 94 416 C 145 440, 235 442, 355 422 C 390 416, 418 402, 438 386" fill="none" stroke="url(#sigGrad)" stroke-width="12" stroke-linecap="round" filter="url(#sigGlow)"/>
  
  <!-- Glowing Pen Nib Accent -->
  <circle cx="438" cy="386" r="11" fill="#60A5FA" filter="url(#sigGlow)"/>
  <circle cx="438" cy="386" r="6" fill="#FFFFFF"/>
</svg>